name: swiftview

services:
  prototype:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4173
      DATABASE_URL: postgresql://${POSTGRES_USER:-swiftview}:${POSTGRES_PASSWORD:-swiftview-local-only}@postgres:5432/${POSTGRES_DB:-swiftview}
      REDIS_URL: redis://:${REDIS_PASSWORD:-swiftview-local-only}@redis:6379/0
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-swiftview}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-swiftview-local-only}
    ports:
      - "${APP_PORT:-4173}:4173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [control]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftview}
      POSTGRES_USER: ${POSTGRES_USER:-swiftview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftview-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docs/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [control]

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:-swiftview-local-only}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, -a, "${REDIS_PASSWORD:-swiftview-local-only}", ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [control]

  turn:
    image: coturn/coturn:latest
    profiles: [relay]
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-localhost}
      - --user=${TURN_USERNAME:-swiftview}:${TURN_CREDENTIAL:-swiftview-local-only}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-loopback-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
    networks: [control]

  gateway:
    image: nginx:1.27-alpine
    profiles: [edge]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      prototype:
        condition: service_healthy
    restart: unless-stopped
    networks: [control]

volumes:
  postgres-data:
  redis-data:

networks:
  control:
    driver: bridge

